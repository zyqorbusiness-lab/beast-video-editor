name: test
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m pip install -r requirements.txt
      - run: node tests/run-tests.mjs
      - name: Render demo (visual smoke test)
        run: |
          cd examples/kinetic-demo
          npm install --no-audit --no-fund
          CHROME_PATH=$(which google-chrome || which chromium) npm run render
          ffprobe -v error -show_entries stream=width,height,nb_frames -of csv out/kinetic-demo.mp4